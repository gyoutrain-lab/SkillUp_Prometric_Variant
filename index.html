// Helper Function: Shuffle options array while updating correct index accurately
function shuffleOptions(options, correctIdx) {
    let arr = options.map((opt, i) => ({ text: opt, isCorrect: i === correctIdx }));
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    const newCorrectIdx = arr.findIndex(item => item.isCorrect);
    return {
        shuffledTexts: arr.map(item => item.text),
        newCorrectIndex: newCorrectIdx
    };
}

// Generate the final processed 100 items with randomized option order
const examData = rawQuestions.map(q => {
    // Extract standards keys from rationales string
    // Format is "NCLEX: X | STR: Y | SCFHS: Z"
    let nclexTarget = "";
    let strTarget = "";
    let scfhsTarget = "";
    const match = q.rationales.match(/NCLEX:\s*([A-D])\s*\|\s*STR:\s*([A-D])\s*\|\s*SCFHS:\s*([A-D])/i);
    if (match) {
        nclexTarget = match[1].toUpperCase();
        strTarget = match[2].toUpperCase();
        scfhsTarget = match[3].toUpperCase();
    }

    const shuffled = shuffleOptions(q.options, q.correctIndex);
    
    // Map initial rationale letters to shuffled position letters
    const origIndexToLetter = (idx) => String.fromCharCode(65 + idx);
    const letterToOrigIndex = (letter) => letter.charCodeAt(0) - 65;
    
    // Function to map original target option letter to the new shuffled option letter
    const mapTargetLetter = (targetLetter) => {
        if (!targetLetter) return "";
        const origIdx = letterToOrigIndex(targetLetter);
        const optionText = q.options[origIdx];
        const newIdx = shuffled.shuffledTexts.indexOf(optionText);
        return origIndexToLetter(newIdx);
    };

    return {
        id: q.id,
        chapter: q.chapter,
        title: q.title,
        story: q.story,
        question: q.question,
        options: shuffled.shuffledTexts,
        answerLetter: String.fromCharCode(65 + shuffled.newCorrectIndex),
        rationales: q.rationales,
        targets: {
            NCLEX: mapTargetLetter(nclexTarget),
            STR: mapTargetLetter(strTarget),
            SCFHS: mapTargetLetter(scfhsTarget)
        }
    };
});

// Render All Questions to UI
function renderQuestions() {
    const container = document.getElementById('questions-container');
    let currentChapter = "";

    examData.forEach(q => {
        if (q.chapter !== currentChapter) {
            currentChapter = q.chapter;
            const chapHeader = document.createElement('div');
            chapHeader.className = 'chapter-header';
            chapHeader.innerHTML = `<h2>${currentChapter}</h2>`;
            container.appendChild(chapHeader);
        }

        const card = document.createElement('div');
        card.className = 'card question-card';
        card.id = `q-card-${q.id}`;

        let optionsHTML = "";
        q.options.forEach((opt, optIdx) => {
            const optLetter = String.fromCharCode(65 + optIdx);
            optionsHTML += `
                <label class="option-btn">
                    <input type="radio" name="question-${q.id}" value="${optLetter}">
                    <span><strong>${optLetter}.</strong> ${opt}</span>
                </label>
            `;
        });

        card.innerHTML = `
            <div class="question-title">${q.title}</div>
            <div class="clinical-story"><strong>Clinical Scenario:</strong> ${q.story}</div>
            <div class="question-stem">${q.question}</div>
            <div class="options">${optionsHTML}</div>
            <div class="rationale-box" id="rationale-${q.id}">
                <strong>Rationales:</strong><br>${q.rationales.replace(/\n/g, '<br>')}
            </div>
        `;

        container.appendChild(card);
    });
}

// Calculate Score with Detailed Standard Breakdown Report
function submitExam() {
    let scfhsCorrect = 0;
    let strCorrect = 0;
    let nclexCorrect = 0;
    const total = examData.length;

    examData.forEach(q => {
        const selected = document.querySelector(`input[name="question-${q.id}"]:checked`);
        const card = document.getElementById(`q-card-${q.id}`);

        if (selected) {
            const val = selected.value;
            let isCorrectSCFHS = false;

            if (val === q.targets.SCFHS) {
                scfhsCorrect++;
                isCorrectSCFHS = true;
            }
            if (val === q.targets.STR) {
                strCorrect++;
            }
            if (val === q.targets.NCLEX) {
                nclexCorrect++;
            }

            if (isCorrectSCFHS) {
                card.style.borderColor = "var(--success)";
            } else {
                card.style.borderColor = "var(--danger)";
            }
        } else {
            card.style.borderColor = "var(--border)";
        }
    });

    const scfhsPct = Math.round((scfhsCorrect / total) * 100);
    const strPct = Math.round((strCorrect / total) * 100);
    const nclexPct = Math.round((nclexCorrect / total) * 100);

    const scoreBanner = document.getElementById('score-banner');
    const breakdownDiv = document.getElementById('category-breakdown');
    const statusDiv = document.getElementById('pass-fail-status');

    scoreBanner.style.display = 'block';

    breakdownDiv.innerHTML = `
        <div class="category-report-grid">
            <div class="category-card">
                <h4>STR Standard</h4>
                <p><strong>Correct:</strong> ${strCorrect} / ${total}</p>
                <p><strong>Percentage:</strong> ${strPct}%</p>
            </div>
            <div class="category-card">
                <h4>NCLEX Standard</h4>
                <p><strong>Correct:</strong> ${nclexCorrect} / ${total}</p>
                <p><strong>Percentage:</strong> ${nclexPct}%</p>
            </div>
            <div class="category-card" style="border-color: var(--primary);">
                <h4>SCFHS Standard</h4>
                <p><strong>Correct:</strong> ${scfhsCorrect} / ${total}</p>
                <p><strong>Percentage:</strong> ${scfhsPct}%</p>
            </div>
        </div>
    `;

    if (scfhsPct > 50) {
        statusDiv.className = "status-box status-pass";
        statusDiv.innerHTML = `STATUS: PASSED (${scfhsPct}% - Above 50% Threshold for SCFHS Standard)`;
    } else {
        statusDiv.className = "status-box status-fail";
        statusDiv.innerHTML = `STATUS: NOT PASSED (${scfhsPct}% - Below or Equal to 50% Threshold for SCFHS Standard)`;
    }

    window.scrollTo({ top: 0, behavior: 'smooth' });
}
